[project]
name = "agent-doorway"
version = "0.1.0"
description = "Self-hostable control plane for company AI: identity, policy, budgets, MCP tool governance and a tamper-evident audit log."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bishal Saha" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "redis>=8.2.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "typer>=0.29.2",
    "uvicorn[standard]>=0.54.0",
]
[project.scripts]
doorway = "agent_doorway.cli.main:app"
[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "pytest>=8",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_doorway"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: needs Docker (real Postgres/Redis containers)",
]

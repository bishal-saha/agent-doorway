# CI for Agent Doorway. Every action is pinned to a full commit SHA (tag in the comment):
# a moved tag cannot change what runs here. Dependabot proposes SHA bumps.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  integration:
    name: Integration tests (real Postgres + Redis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --frozen
      - run: uv run pytest -m integration

  compose-smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose up -d --build --wait
      - run: curl -fsS http://localhost:8080/readyz
      - name: Create a key and call the mock model
        run: |
          docker compose exec -T gateway doorway tenants create demo --name Demo
          docker compose exec -T gateway doorway teams create demo ci
          KEY=$(docker compose exec -T gateway doorway keys create demo ci --name smoke)
          echo "::add-mask::$KEY"
          curl -fsS http://localhost:8080/v1/chat/completions \
            -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d '{"model": "mock", "messages": [{"role": "user", "content": "ping"}]}'
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  supply-chain:
    name: Secrets, vulnerabilities, SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Export locked runtime dependencies (with hashes)
        run: uv export --frozen --no-dev --no-emit-project -o requirements.txt
      - name: Audit dependencies for known vulnerabilities
        run: uvx pip-audit -r requirements.txt --disable-pip --require-hashes
      - name: Generate SBOM (CycloneDX)
        run: uvx --from cyclonedx-bom cyclonedx-py requirements requirements.txt -o sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
